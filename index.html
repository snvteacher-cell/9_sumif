<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Що знімати далі?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Урок-самоопрацювання для 9 класу: «Що знімати далі?» (COUNTIF, SUMIF). Теорія → міні-таблиця → 4 завдання → оцінка, що йде вчителю */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#1E2430; --muted:#5E6675; --line:#DCD6C8;
  --accent:#D6452B; --accent-soft:#FBE3DC; --blue:#2458A6; --blue-soft:#E1EAF7;
  --ok:#24804B; --ok-soft:#DDF1E4; --bad:#B3261E; --bad-soft:#F9DEDC; --warn:#8A5A00; --warn-soft:#FDF0D2;
  --cell:#FFFFFF; --cell-data:#F2F5F9; --cell-head:#E9ECEF;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171D; --surface:#1D222B; --ink:#E8EAEE; --muted:#A3AAB6; --line:#343B47;
  --accent:#FF7A5C; --accent-soft:#3A221D; --blue:#7FA8F0; --blue-soft:#1E2A40;
  --ok:#6BCB8D; --ok-soft:#1B3325; --bad:#FF8A80; --bad-soft:#3B1E1C; --warn:#F2C062; --warn-soft:#3A2F18;
  --cell:#1D222B; --cell-data:#252B36; --cell-head:#2C3340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171D; --surface:#1D222B; --ink:#E8EAEE; --muted:#A3AAB6; --line:#343B47;
  --accent:#FF7A5C; --accent-soft:#3A221D; --blue:#7FA8F0; --blue-soft:#1E2A40;
  --ok:#6BCB8D; --ok-soft:#1B3325; --bad:#FF8A80; --bad-soft:#3B1E1C; --warn:#F2C062; --warn-soft:#3A2F18;
  --cell:#1D222B; --cell-data:#252B36; --cell-head:#2C3340; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font:800 15px/1.1 var(--display);letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--accent)}
.who{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;gap:4px;max-width:860px;margin:0 auto;padding:0 16px 10px}
.steps button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0;cursor:pointer}
.steps button.done{background:var(--blue)}
.steps button.cur{background:var(--accent)}
.steps button:disabled{cursor:default}

h1{font:800 clamp(24px,5vw,36px)/1.15 var(--display);margin:28px 0 10px}
h2{font:700 clamp(20px,4vw,26px)/1.2 var(--display);margin:26px 0 8px}
h3{font:700 18px/1.3 var(--body);margin:20px 0 6px}
.kicker{font:600 12px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-top:26px}
p{margin:8px 0}
.lead{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.story{border-left:6px solid var(--accent)}
.note{background:var(--blue-soft);border-radius:12px;padding:12px 16px;margin:12px 0}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;margin:12px 0}
code,.f{font:600 15px/1.4 var(--mono);background:var(--cell-data);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.big{font:700 22px/1.3 var(--mono)}
.formula{font:500 18px/1.6 var(--mono);text-align:center;padding:8px;overflow-x:auto}
table.simple{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
table.simple th,table.simple td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.simple th{background:var(--cell-head)}
.scroll{overflow-x:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--cell-data);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin:2px;font:600 15px var(--mono)}
.chip.hl{background:var(--accent-soft);border-color:var(--accent)}

label.fld{display:block;font-weight:600;margin:12px 0 4px}
input.txt{font:17px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;max-width:420px;background:var(--surface);color:var(--ink)}
input.txt:focus{outline:2px solid var(--blue);border-color:transparent}

.btn{font:600 16px var(--body);border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
nav.bottom .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
nav.bottom .mid{flex:1;text-align:center;font-size:13px;color:var(--muted)}

/* питання */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.q .qt{font-weight:600}
.q .pts{float:right;font:600 12px var(--body);color:var(--muted);margin-left:8px}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ans input{font:600 18px var(--mono);padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;width:150px;background:var(--surface);color:var(--ink)}
.ans .unit{color:var(--muted)}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:16px/1.4 var(--body);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px}
.opt.sel .mk{border-color:var(--blue);background:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.hint{background:var(--warn-soft);color:var(--ink)}
.fb.hint b{color:var(--warn)}
.tries{font-size:13px;color:var(--muted)}

/* міні-таблиця */
.sheetbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.sheettools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--cell-head)}
.fbar{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;font:500 14px var(--mono)}
.fbar .ref{min-width:38px;font-weight:700;color:var(--blue)}
.fbar .raw{flex:1;background:var(--cell);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-height:28px;overflow-x:auto;white-space:nowrap}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:collapse;font:500 15px var(--mono);min-width:100%}
table.grid th{background:var(--cell-head);color:var(--muted);font-weight:600;font-size:13px;padding:4px 6px;border:1px solid var(--line);min-width:28px}
table.grid td{border:1px solid var(--line);padding:0;height:36px;min-width:118px}
table.grid td.data{background:var(--cell-data);padding:0 8px}
table.grid td.data.num{text-align:right}
table.grid td.head{background:var(--cell-data);font-family:var(--body);font-weight:700;padding:0 8px;font-size:14px}
table.grid input{width:100%;height:36px;border:0;padding:0 8px;font:600 15px var(--mono);background:var(--cell);color:var(--ink);text-align:right}
table.grid input.txtcell{text-align:left}
table.grid input:focus{outline:2.5px solid var(--blue);outline-offset:-2px;text-align:left}
table.grid input.err{color:var(--bad)}
table.grid input.calc{color:var(--blue)}
table.grid input::placeholder{color:var(--line)}
.sheethelp{font-size:13px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}

/* результат */
.result{border:3px solid var(--accent);border-radius:18px;padding:20px;background:var(--surface);text-align:center}
table.simple tr.hl td{background:var(--accent-soft)}
table.grid td.data.wide{min-width:190px;white-space:nowrap;font-size:14px}
.result .grade{font:800 72px/1 var(--display);color:var(--accent);margin:8px 0}
.result .code{font:700 22px var(--mono);letter-spacing:3px}
.status{margin-top:12px;padding:10px;border-radius:10px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.wait{background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9}
@media (max-width:560px){
  body{font-size:16px}
  .brand span{display:none}
  .q .pts{float:none;display:block;margin:0 0 4px}
  table.grid td{min-width:96px}
}
</style>
</head>
<body>
<header class="top">
  <div class="in"><div class="brand">COUNTIF <b>і</b> SUMIF <span>· 9 клас</span></div><div class="who" id="who"></div></div>
  <div class="steps" id="steps"></div>
</header>
<main class="wrap" id="main"></main>
<nav class="bottom" id="nav" hidden>
  <div class="in">
    <button class="btn sec" id="back">← Назад</button>
    <div class="mid" id="navmid"></div>
    <button class="btn" id="next">Далі →</button>
  </div>
</nav>

<script>
/* ===================== налаштування ===================== */
var TEACHER_EMAIL = 'snv.teacher@gmail.com';
var LESSON = 'Дані та аналітичні висновки. Функції COUNTIF, SUMIF (9 клас)';
var STORE_KEY = 'countif9-lesson-v1';
var SUBJ = 'COUNTIF/SUMIF 9 кл.';

/* ===================== утиліти ===================== */
function $(s,r){return (r||document).querySelector(s)}
function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[ʼ’`']/g,"'")}
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmt(x,d){if(typeof x!=='number')return String(x);if(d==null){d=4}var s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString();return s.replace('.',',')}
function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,'').replace(',','.');if(!/^[-+]?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
function sum(a){return a.reduce(function(s,x){return s+x},0)}
function toast(msg){var t=el('div',{class:'toast'},esc(msg));document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function lsGet(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(STORE_KEY,JSON.stringify(v))}catch(e){}}

/* ===================== формули міні-таблиці ===================== */
var LOOKALIKE={'А':'A','В':'B','С':'C','Е':'E','Н':'H','І':'I','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X','а':'a','с':'c','е':'e','і':'i','о':'o','р':'p','х':'x'};
/* назви з російськомовних версій Excel теж працюють */
var ALIAS={'СЧЁТЕСЛИ':'COUNTIF','СЧЕТЕСЛИ':'COUNTIF','СУММЕСЛИ':'SUMIF','СРЗНАЧЕСЛИ':'AVERAGEIF','СУММ':'SUM','СРЗНАЧ':'AVERAGE','СЧЁТ':'COUNT','СЧЕТ':'COUNT','МАКС':'MAX','МИН':'MIN','ОКРУГЛ':'ROUND'};
function FErr(code,msg){this.code=code;this.msg=msg}
function colIdx(c){return c.charCodeAt(0)-65}
function latinize(s){return String(s).replace(/[А-Яа-яІі]/g,function(ch){return LOOKALIKE[ch]||ch})}
/* однаковий вигляд тексту: без регістру, зайвих пробілів і схожих латинських літер */
function canon(s){return latinize(String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[ʼ’`']/g,"'"))}
/* умова COUNTIF / SUMIF: "Ігри", ">1000", "<>Гумор", 500, посилання на клітинку */
function matcher(cr){
  if(Array.isArray(cr))cr=cr[0];
  if(typeof cr==='number')return function(x){return typeof x==='number'&&x===cr};
  var mm=String(cr).match(/^\s*(<=|>=|<>|<|>|=)?\s*(.*)$/),op=mm[1]||'=',rest=mm[2],val=parseNum(rest);
  if(!isNaN(val))return function(x){if(typeof x!=='number'){x=parseNum(x);if(isNaN(x))return op==='<>'}
    return op==='='?x===val:op==='<>'?x!==val:op==='<'?x<val:op==='>'?x>val:op==='<='?x<=val:x>=val};
  if(op!=='='&&op!=='<>')return function(){return false};
  var c=canon(rest),re=/[*?]/.test(c)?new RegExp('^'+c.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'):null;
  return function(x){var s=canon(x===''||x==null?'':x),hit=re?re.test(s):s===c;return op==='='?hit:!hit};
}
function evalFormula(src,getCell){
  src=src.replace(/[«»“”„″]/g,'"');
  /* кирилицю замінюємо лише поза лапками, щоб "Ігри" лишилося текстом */
  src=src.split('"').map(function(part,k){if(k%2)return part;
    part=part.replace(/[А-ЯЁЇІЄа-яёїіє]+(?=\s*\()/g,function(w){return ALIAS[w.toUpperCase()]||w});
    return latinize(part)}).join('"');
  var semi=src.indexOf(';')>=0, toks=[], i=0, m;
  while(i<src.length){
    var rest=src.slice(i);
    if(/^\s/.test(rest)){i++;continue}
    if((m=rest.match(semi?/^\d+([.,]\d+)?/:/^\d+(\.\d+)?/))){toks.push({t:'n',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue}
    if((m=rest.match(/^"([^"]*)"/))){toks.push({t:'s',v:m[1]});i+=m[0].length;continue}
    if(rest[0]==='"')throw new FErr('#ПОМИЛКА','Лапки не закриті. Текст в умові пишуть між двома лапками: "Ігри"');
    if((m=rest.match(/^\$?([A-Za-z])\$?(\d+)(?![A-Za-z0-9_.(])/))){toks.push({t:'r',v:m[1].toUpperCase()+m[2]});i+=m[0].length;continue}
    if((m=rest.match(/^[A-Za-z_А-ЯЁЇІЄа-яёїієʼ’'][A-Za-z0-9_.А-ЯЁЇІЄа-яёїієʼ’']*/))){toks.push({t:'id',v:m[0].toUpperCase(),raw:m[0]});i+=m[0].length;continue}
    if((m=rest.match(/^(<=|>=|<>|[-+*\/^():;,<>=&%])/))){toks.push({t:'o',v:m[0]});i+=m[0].length;continue}
    throw new FErr('#ІМ\'Я?','Незрозумілий символ «'+rest[0]+'»');
  }
  var p=0, SEP=semi?';':',';
  function peek(v){return toks[p]&&toks[p].t==='o'&&toks[p].v===v}
  function expect(v){if(!peek(v))throw new FErr('#ПОМИЛКА','Очікувалось «'+v+'»');p++}
  function num(v){if(Array.isArray(v)){if(v.length===1)return num(v[0]);throw new FErr('#ЗНАЧ!','Діапазон тут не підходить')}if(typeof v==='number')return v;if(v===''||v==null)return 0;var n=parseNum(v);if(isNaN(n))throw new FErr('#ЗНАЧ!','Текст замість числа');return n}
  function expr(){var v=cmp();while(peek('&')){p++;var r=cmp();v=String(Array.isArray(v)?v[0]:v)+String(Array.isArray(r)?r[0]:r)}return v}
  function cmp(){return add()}
  function add(){var v=term();while(peek('+')||peek('-')){var o=toks[p++].v,r=term();v=o==='+'?num(v)+num(r):num(v)-num(r)}return v}
  function term(){var v=power();while(peek('*')||peek('/')){var o=toks[p++].v,r=power();if(o==='*')v=num(v)*num(r);else{if(num(r)===0)throw new FErr('#ДІЛ/0!','Ділення на нуль');v=num(v)/num(r)}}return v}
  function power(){var v=unary();if(peek('^')){p++;v=Math.pow(num(v),num(power()))}return v}
  function unary(){if(peek('-')){p++;return -num(unary())}if(peek('+')){p++;return unary()}return primary()}
  function primary(){
    var t=toks[p];
    if(!t)throw new FErr('#ПОМИЛКА','Формула обірвалась');
    if(t.t==='n'){p++;return t.v}
    if(t.t==='s'){p++;return t.v}
    if(t.t==='r'){p++;
      if(peek(':')){p++;var t2=toks[p++];if(!t2||t2.t!=='r')throw new FErr('#ПОМИЛКА','Після «:» має бути клітинка');return range(t.v,t2.v)}
      return getCell(t.v)}
    if(t.t==='id'){p++;
      if(!peek('(')){var w=/[А-ЯЁЇІЄа-яёїіє]/.test(t.raw)?t.raw.replace(/[A-Za-z]/g,function(ch){for(var k in LOOKALIKE)if(LOOKALIKE[k]===ch)return k;return ch}):t.raw;
        throw new FErr('#ІМ\'Я?','Таблиця не знає слова «'+w+'». Якщо це текст для умови, візьміть його в лапки: "'+w+'"');}
      p++;var args=[];
      if(!peek(')')){args.push(expr());while(peek(SEP)||peek(';')||(!semi&&peek(','))){p++;args.push(expr())}}
      expect(')');return callFn(t.v,args)}
    if(t.t==='o'&&t.v==='('){p++;var v=expr();expect(')');return v}
    throw new FErr('#ПОМИЛКА','Зайвий знак «'+t.v+'»');
  }
  function range(a,b){var c1=colIdx(a[0]),c2=colIdx(b[0]),r1=+a.slice(1),r2=+b.slice(1),out=[];
    if(c1>c2){var x=c1;c1=c2;c2=x}if(r1>r2){var y=r1;r1=r2;r2=y}
    for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++)out.push(getCell(String.fromCharCode(65+c)+r));return out}
  function nums(args){var out=[];args.forEach(function(a){if(Array.isArray(a))a.forEach(function(x){if(typeof x==='number')out.push(x)});else if(typeof a==='number')out.push(a);else if(a!==''){var n=parseNum(a);if(!isNaN(n))out.push(n)}});return out}
  function need(args,n,name,how){if(args.length<n)throw new FErr('#ПОМИЛКА','У '+name+' замало аргументів. Потрібно: '+how)}
  function picked(args,name){
    var rng=Array.isArray(args[0])?args[0]:[args[0]],f=matcher(args[1]),sr=args.length>2?(Array.isArray(args[2])?args[2]:[args[2]]):rng,out=[];
    rng.forEach(function(x,k){if(f(x)){var v=sr[k];if(typeof v==='number')out.push(v)}});return out;
  }
  function callFn(name,args){
    var a;
    switch(name){
      case 'SUM': return sum(nums(args));
      case 'AVERAGE': a=nums(args);if(!a.length)throw new FErr('#ДІЛ/0!','У діапазоні немає чисел');return sum(a)/a.length;
      case 'MIN': a=nums(args);return a.length?Math.min.apply(null,a):0;
      case 'MAX': a=nums(args);return a.length?Math.max.apply(null,a):0;
      case 'COUNT': return nums(args).length;
      case 'COUNTA': var cnt=0;args.forEach(function(x){(Array.isArray(x)?x:[x]).forEach(function(y){if(y!==''&&y!=null)cnt++})});return cnt;
      case 'ROUND': var f=Math.pow(10,args.length>1?num(args[1]):0);return Math.round(num(args[0])*f)/f;
      case 'ABS': return Math.abs(num(args[0]));
      case 'COUNTIF':
        need(args,2,'COUNTIF','діапазон і умова, напр. (B2:B9;"Піца")');
        var rng=Array.isArray(args[0])?args[0]:[args[0]],fm=matcher(args[1]);
        return rng.filter(function(x){return fm(x)}).length;
      case 'SUMIF':
        need(args,2,'SUMIF','де шукати; умова; що додавати');
        return sum(picked(args));
      case 'AVERAGEIF':
        need(args,2,'AVERAGEIF','де шукати; умова; що усереднювати');
        a=picked(args);if(!a.length)throw new FErr('#ДІЛ/0!','Жоден рядок не підійшов під умову');return sum(a)/a.length;
    }
    throw new FErr('#ІМ\'Я?','Функції «'+name+'» тут немає. Перевірте назву.');
  }
  var v=expr();
  if(p<toks.length)throw new FErr('#ПОМИЛКА','Зайве в кінці: «'+(toks[p].raw||toks[p].v)+'»');
  if(Array.isArray(v)){if(v.length===1)return v[0];throw new FErr('#ЗНАЧ!','Результат — цілий діапазон. Потрібна функція, напр. COUNTIF(...)')}
  return v;
}

Sheet.prototype.raw=function(ref){var c=this.cfg;if(ref in c.cells)return c.cells[ref];return this.user[ref]||''};
Sheet.prototype.val=function(ref,seen){
  seen=seen||{};

  if(typeof r==='number')return r;

Sheet.prototype.inGrid=function(ref){var c=colIdx(ref[0]),r=+ref.slice(1);return c>=0&&c<this.cfg.ncols&&r>=1&&r<=this.cfg.nrows};

function genData(seedStr){
  var rng=mulberry32(cyrb53(seedStr)),d={},rows,by;
  for(var guard=0;guard<500;guard++){
    var n={'Ігри':ri(rng,7,8),'Тварини':3,'Гумор':ri(rng,4,5)};n['Лайфхаки']=20-n['Ігри']-n['Тварини']-n['Гумор'];
    var lo={'Ігри':600,'Гумор':450,'Тварини':1700,'Лайфхаки':350},hi={'Ігри':1350,'Гумор':1250,'Тварини':2600,'Лайфхаки':1150};
    rows=[];by={};
    THEMES.forEach(function(th){by[th]={n:n[th],sum:0};var tt=shuffle(rng,TITLES[th]);for(var k=0;k<n[th];k++){var v=ri(rng,lo[th]/10,hi[th]/10)*10+ri(rng,0,9);rows.push({t:tt[k],th:th,v:v});by[th].sum+=v}});
    THEMES.forEach(function(th){by[th].avg=by[th].sum/by[th].n});
    var maxSum=Math.max.apply(null,THEMES.map(function(th){return by[th].sum})),maxAvg=Math.max.apply(null,THEMES.map(function(th){return by[th].avg}));
    if(by['Ігри'].sum!==maxSum||by['Ігри'].sum<by['Тварини'].sum+600)continue;
    if(by['Тварини'].avg!==maxAvg||by['Тварини'].avg<1.6*by['Ігри'].avg)continue;
    var N=[1000,1200][ri(rng,0,1)];
    if(rows.some(function(r){return r.v===N}))continue;
    var above=rows.filter(function(r){return r.v>N});
    if(above.length<4||above.length>10)continue;
    d.N=N;d.cntAbove=above.length;d.sumAbove=sum(above.map(function(r){return r.v}));
    break;
  }
  d.rows=shuffle(rng,rows);d.by=by;d.total=sum(d.rows.map(function(r){return r.v}));
  d.rng=rng;
  return d;
}

function renderQ(id){
  var q=Q[id],a=S.answers[id]||(S.answers[id]={tries:0,done:false,pts:0,given:[]}),box=el('div',{class:'q'});
  var num=QNAMES[id].split(' ')[0];
  box.appendChild(el('div',{class:'qt'},'<span class="pts">1 бал</span><span style="color:var(--muted)">'+num+'.</span> '+q.text));
  var fbz=el('div');
  if(q.type==='num'){
    var row=el('div',{class:'ans'}),inp=el('input',{type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'відповідь','aria-label':'Відповідь'}),btn=el('button',{class:'btn small',type:'button'},'Перевірити'),tries=el('span',{class:'tries'});
    row.appendChild(inp);if(q.unit)row.appendChild(el('span',{class:'unit'},q.unit));row.appendChild(btn);row.appendChild(tries);box.appendChild(row);box.appendChild(fbz);
    function paint(){
      fbz.innerHTML='';
      if(a.done){inp.value=a.given[a.given.length-1]||'';inp.disabled=true;btn.disabled=true;
        if(a.pts>0)fbz.appendChild(el('div',{class:'fb ok'},'✓ Правильно! '+(a.pts===1?'+1 бал':'+0,5 бала (з третьої спроби)')));
        else fbz.appendChild(el('div',{class:'fb bad'},'Спроби закінчились. Правильна відповідь: <b>'+esc(q.ans)+'</b>. Розберіться, як її отримати, бо це знадобиться далі.'));
        tries.textContent='';return}
      tries.textContent=a.tries?('Спроба '+(a.tries+1)+' з 3'):'3 спроби';
      if(a.tries>0){
        if(a.lastMsg)fbz.appendChild(el('div',{class:'fb bad'},'✗ '+esc(a.lastMsg)));
        else fbz.appendChild(el('div',{class:'fb bad'},'✗ Поки що ні. Ваша відповідь: '+esc(a.given[a.given.length-1])));
        for(var h=0;h<Math.min(a.tries,q.hints.length);h++)fbz.appendChild(el('div',{class:'fb hint'},'<b>Підказка '+(h+1)+':</b> '+q.hints[h]));
      }
    }
    btn.onclick=function(){
      if(S.finished)return;
      var x=parseNum(inp.value);
      if(isNaN(x)){toast('Введіть число, наприклад 7 або 1250');inp.focus();return}
      a.given.push(inp.value.trim());a.tries++;
      if(q.ok(x)){a.done=true;a.pts=a.tries<=2?1:0.5;a.lastMsg=''}
      else{a.lastMsg=q.check&&q.check(x)||'';if(a.tries>=3){a.done=true;a.pts=0}}
      save();paint();updateNav();
    };
    inp.onkeydown=function(e){if(e.key==='Enter')btn.click()};
    paint();
  }else{
    var opts=el('div',{class:'opts'});box.appendChild(opts);box.appendChild(fbz);
    q.opts.forEach(function(op,i){
      var b=el('button',{class:'opt',type:'button'},'<span class="mk"></span><span>'+op.t+'</span>');
      b.onclick=function(){if(a.done||S.finished)return;a.done=true;a.choice=i;a.pts=op.r?1:0;a.tries=1;a.given=[op.t.replace(/<[^>]+>/g,'')];save();paintMc();updateNav()};
      opts.appendChild(b);
    });
    function paintMc(){
      var bs=opts.children;fbz.innerHTML='';
      for(var i=0;i<bs.length;i++){bs[i].disabled=!!a.done;bs[i].classList.remove('sel','right','wrong');
        if(a.done){if(q.opts[i].r)bs[i].classList.add('right');else if(i===a.choice)bs[i].classList.add('wrong')}}
      if(a.done)fbz.appendChild(el('div',{class:'fb '+(a.pts?'ok':'bad')},(a.pts?'✓ Так! +1 бал. ':'✗ Ні. ')+q.why));
      else fbz.appendChild(el('div',{class:'tries'},'Одна спроба: подумайте, перш ніж натиснути.'));
    }
    paintMc();
  }
  return box;
}

/* ===================== перевір себе в теорії (без оцінки) ===================== */
function selfCheck(id,text,opts,ok,why){
  var box=el('div',{class:'q'});
  box.appendChild(el('div',{class:'qt'},'<span class="pts">без оцінки</span>🤔 Перевір себе: '+text));
  var os=el('div',{class:'opts'}),fb=el('div');box.appendChild(os);box.appendChild(fb);
  opts.forEach(function(t,i){var b=el('button',{class:'opt',type:'button'},'<span class="mk"></span><span>'+t+'</span>');b.onclick=function(){S.theory[id]=i;save();paint()};os.appendChild(b)});
  function paint(){var c=S.theory[id];fb.innerHTML='';for(var i=0;i<os.children.length;i++){os.children[i].classList.remove('right','wrong');if(c!=null){if(i===ok)os.children[i].classList.add('right');else if(i===c)os.children[i].classList.add('wrong')}}
    if(c!=null)fb.appendChild(el('div',{class:'fb '+(c===ok?'ok':'hint')},(c===ok?'✓ Так. ':'Не зовсім. ')+why))}
  paint();return box;
}

  '<p class="tries">Для допитливих: в Excel є ще й AVERAGEIF, яка одразу рахує середнє за умовою. Але SUMIF / COUNTIF дає те саме.</p>';
  m.appendChild(selfCheck('th5','Петро забив за сезон 12 голів у 12 матчах, а Андрій 6 голів у 3 матчах. Хто частіше забиває <b>за один матч</b>?',['Петро, бо 12 більше за 6','Андрій: 2 голи за матч проти 1','Однаково'],1,'12 : 12 = 1 гол за матч у Петра, 6 : 3 = 2 у Андрія. Сума більша в Петра лише тому, що він зіграв більше матчів.'));
};
R.th6=function(m){
  m.innerHTML='<div class="kicker">Теорія 6 з 6</div><h1>Спробуйте в таблиці</h1>'+
  '<p>Нижче — міні-таблиця з даними буфету. Сірі клітинки містять дані, у білі можна писати. Формула завжди починається зі знака <b>=</b>.</p>'+
  '<div class="note"><b>Спробуйте:</b><ol style="margin:4px 0 0;padding-left:22px"><li>У клітинку <b>F2</b> введіть <code>=COUNTIF(B2:B9;"Піца")</code> і натисніть Enter. Має вийти 3.</li>'+
  '<li>У <b>F3</b>: <code>=SUMIF(B2:B9;"Піца";C2:C9)</code>. Має вийти 75.</li>'+
  '<li>У <b>F4</b>: <code>=F3/F2</code>. Це середня ціна однієї піци.</li>'+
  '<li>Тепер самі: скільки разів купили сік і скільки він приніс? Пишіть у F5 і F6.</li></ol></div>';
  var cells={A1:'Покупка',B1:'Товар',C1:'Ціна, грн'};colCells('A',2,BUF.map(function(_,i){return '№'+(i+1)}),cells);colCells('B',2,BUF.map(function(r){return r[0]}),cells);colCells('C',2,BUF.map(function(r){return r[1]}),cells);
  var ph={E2:'к-сть піци',E3:'грн за піцу',E4:'середнє',E5:'к-сть соку',E6:'грн за сік'};
  m.appendChild(new Sheet(sheetCfg('demo',6,12,cells,null,ph),S).render());
  m.appendChild(el('p',{class:'tries'},'Діапазон <b>B2:B9</b> означає «від B2 до B9». Розділювач можна писати як «;», так і «,». Маленькі літери й кириличні А, В, С таблиця теж зрозуміє. Хто працює в Excel чи Google Таблицях, натисніть «Копіювати дані» і вставте дані у свою таблицю.'));
};
function taskHeader(n,title,story){return '<div class="kicker">Завдання '+n+' з 4 · '+TASK_POINTS[n]+' бал'+(TASK_POINTS[n]<5?'и':'ів')+'</div><h1>'+title+'</h1><div class="card story">'+story+'</div>'}
/* одна таблиця каналу на завдання 1–3: формули учня зберігаються між сторінками */
function channelSheet(){
  var d=D,cells={A1:'Відео',B1:'Тема',C1:'Перегляди'};
  colCells('A',2,d.rows.map(function(r){return r.t}),cells);colCells('B',2,d.rows.map(function(r){return r.th}),cells);colCells('C',2,d.rows.map(function(r){return r.v}),cells);
  var ph={D2:'к-сть Ігри',D3:'к-сть Тварини',D4:'к-сть хітів',D5:'сума Ігри',D6:'сума Тварини',D7:'сума хітів',D8:'середнє Ігри',D9:'середнє Тварини'};
  return new Sheet(sheetCfg('ch',5,24,cells,'Підписи вже підказані в стовпці D. Клацніть білу клітинку поруч у стовпці E, введіть формулу зі знаком <b>=</b> і натисніть Enter. Формули зберігаються й на інших сторінках завдань.',ph,['A']),S).render();
}
R.task1=function(m){
  m.innerHTML=taskHeader(1,'Огляд каналу','<p>Ось ваші 20 відео: назва, тема і скільки переглядів кожне зібрало. Почнімо з простого: скільки відео якої теми ви зняли і скільки серед них справжніх хітів.</p><p class="tries" style="margin:0">Функція: <b>COUNTIF</b>. Формули пишіть у білих клітинках праворуч (стовпець E, поруч із підписами в D).</p>');
  m.appendChild(channelSheet());
  ['t1a','t1b','t1c'].forEach(function(id){m.appendChild(renderQ(id))});
};
R.task2=function(m){
  m.innerHTML=taskHeader(2,'Скільки переглядів дає кожна тема','<p>Кількість відео ви знаєте. Тепер з’ясуйте, скільки переглядів разом зібрала кожна тема.</p><p class="tries" style="margin:0">Функція: <b>SUMIF</b>. Таблиця та сама, ваші формули із завдання 1 на місці.</p>');
  m.appendChild(channelSheet());
  ['t2a','t2b','t2c'].forEach(function(id){m.appendChild(renderQ(id))});
};
R.task3=function(m){
  m.innerHTML=taskHeader(3,'Аналітичний висновок','<p>Час вирішити, яке відео знімати наступним. Ваш друг каже: «Знімай ігри, вони ж зібрали найбільше переглядів!» Перевірте, чи він правий. Згадайте пастку аналітика з 5-ї сторінки теорії.</p>');
  m.appendChild(channelSheet());
  ['t3a','t3b','t3c','t3d'].forEach(function(id){m.appendChild(renderQ(id))});
};
R.task4=function(m){
  m.innerHTML=taskHeader(4,'Знайди помилку','<p>Ваш друг теж завів канал і пробує рахувати сам, але в нього не все виходить. Допоможіть йому. Таблиця в друга така сама: теми в стовпці B (B2:B21), перегляди в стовпці C (C2:C21).</p>');
  ['t4a','t4b'].forEach(function(id){m.appendChild(renderQ(id))});
};

/* ===================== результат і надсилання ===================== */
function gradeOf(p){return Math.max(1,Math.min(12,Math.round(p)))}
function verifyCode(name,cls,grade){return cyrb53(norm(name)+'|'+norm(cls)+'|'+grade+'|CNT9').toString(36).slice(-5).toUpperCase()}
function tasksLine(){return [1,2,3,4].map(function(t){return 'З'+t+': '+fmt(taskPoints(t),1)+'/'+TASK_POINTS[t]}).join(', ')}
function payload(){
  var rows=[];
  for(var id in Q){var a=S.answers[id]||{};rows.push({q:QNAMES[id],answer:(a.given||[]).join(' → ')||'—',correct:Q[id].type==='num'?Q[id].ans:'',tries:a.tries||0,points:a.pts||0})}
  var mins=S.started?Math.round((new Date(S.finishedAt)-new Date(S.started))/60000):null;
  return {lesson:LESSON,name:S.name,cls:S.cls,grade:S.grade,points:S.points,code:S.code,tasks:tasksLine(),
    started:S.started,finished:S.finishedAt,minutes:mins,details:rows};
}
function sendResult(cb){
  var p=payload();
  if(window.google&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(function(){cb(true)}).withFailureHandler(function(e){cb(false,String(e&&e.message||e))}).submitResult(p);return;
  }
  if(!/^https?:/.test(location.protocol)){cb(false,'Сторінку відкрито як файл, тож автоматичне надсилання не працює.');return}
  var fd={_subject:SUBJ+': '+p.name+' ('+p.cls+') — '+p.grade+' б.',_template:'table',_captcha:'false',
    'Учень':p.name,'Клас':p.cls,'Оцінка':p.grade,'Бали':fmt(p.points,1)+' з 12','За завданнями':p.tasks,'Код':p.code,'Хвилин':p.minutes,
    'Відповіді':p.details.map(function(r){return r.q+': '+r.answer+(r.correct?' (прав. '+r.correct+')':'')+' = '+r.points}).join(' | ')};
  fetch('https://formsubmit.co/ajax/'+TEACHER_EMAIL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(fd)})
    .then(function(r){return r.json().then(function(j){if(r.ok&&String(j.success)!=='false')cb(true);else cb(false,j.message||('HTTP '+r.status))})})
    .catch(function(e){cb(false,String(e))});
}
function mailtoLink(){var p=payload();var body='Учень: '+p.name+'\nКлас: '+p.cls+'\nОцінка: '+p.grade+'\nБали: '+fmt(p.points,1)+' з 12\n'+p.tasks+'\nКод перевірки: '+p.code+'\n';
  return 'mailto:'+TEACHER_EMAIL+'?subject='+encodeURIComponent(SUBJ+': '+p.name+' — '+p.grade+' б.')+'&body='+encodeURIComponent(body)}
R.finish=function(m){
  if(!S.finished){
    var miss=0;for(var id in Q){var a=S.answers[id];if(!a||!a.done)miss++}
    m.innerHTML='<div class="kicker">Фініш</div><h1>Здати роботу</h1>'+
      '<div class="card"><table class="simple"><tr><th>Завдання</th><th>Бали</th></tr>'+
      [1,2,3,4].map(function(t){return '<tr><td>Завдання '+t+'</td><td>'+fmt(taskPoints(t),1)+' з '+TASK_POINTS[t]+'</td></tr>'}).join('')+
      '<tr><th>Разом</th><th>'+fmt(totalPoints(),1)+' з 12</th></tr></table></div>'+
      (miss?'<div class="warnbox">⚠️ Без відповіді: <b>'+miss+'</b> пит. За них буде 0 балів. Поверніться до завдань (кнопка «Назад» або смужки вгорі).</div>':'<div class="note">Усі відповіді дано. Можна здавати.</div>')+
      '<p>Після здачі змінити відповіді вже не вийде.</p><button class="btn" id="submit">Здати й надіслати вчителю</button>';
    $('#submit').onclick=function(){
      if(miss&&!confirm('Є питання без відповіді. Все одно здати?'))return;
      S.finished=true;S.finishedAt=new Date().toISOString();S.points=totalPoints();S.grade=gradeOf(S.points);S.code=verifyCode(S.name,S.cls,S.grade);S.sent=false;save();render();
    };
    return;
  }
  m.innerHTML='<div class="kicker">Фініш</div><h1>Готово!</h1>'+
    '<div class="result"><div>'+esc(S.name)+' · '+esc(S.cls)+'</div><div class="grade">'+S.grade+'</div><div>балів з 12 (набрано '+fmt(S.points,1)+')</div>'+
    '<div style="margin-top:10px;color:var(--muted);font-size:14px">'+tasksLine().replace(/, /g,' · ')+'</div>'+
    '<div style="margin-top:14px;font-size:13px;color:var(--muted)">код перевірки</div><div class="code">'+S.code+'</div>'+
    '<div style="font-size:13px;color:var(--muted);margin-top:4px">'+new Date(S.finishedAt).toLocaleString('uk-UA')+'</div>'+
    '<div id="sendst"></div></div>'+
    '<h2>Що варто запам’ятати</h2><div class="card"><ul style="padding-left:22px;margin:0">'+
    '<li><b>COUNTIF</b>(де шукати; умова) відповідає на питання «скільки разів?».</li>'+
    '<li><b>SUMIF</b>(де шукати; умова; що додавати) відповідає на питання «скільки всього?».</li>'+
    '<li>Текст і знаки порівняння в умові беремо в лапки: <code>"Ігри"</code>, <code>"&gt;1000"</code>.</li>'+
    '<li>Велика сума ще не означає «найкраще». Коли груп різна кількість, порівнюйте <b>середнє на одну штуку</b> = SUMIF : COUNTIF.</li></ul></div>';
  var st=$('#sendst');
  function show(){
    if(S.sent){st.className='status ok';st.innerHTML='✓ Результат надіслано вчителю.';return}
    st.className='status wait';st.innerHTML='Надсилаю результат вчителю…';
    sendResult(function(ok,err){
      if(ok){S.sent=true;save();show()}
      else{st.className='status bad';st.innerHTML='Не вдалося надіслати автоматично.<br><small>'+esc(err||'')+'</small><br><button class="btn small" id="retry" style="margin-top:8px">Спробувати ще раз</button> <a class="btn small sec" style="text-decoration:none;display:inline-block;margin-top:8px" href="'+mailtoLink()+'">Надіслати листом</a><br><small>Або зробіть скріншот цієї картки й надішліть учителю.</small>';
        $('#retry').onclick=show}
    });
  }
  show();
};

/* ===================== навігація ===================== */
function initData(){D=genData(norm(S.name)+'|'+norm(S.cls));buildQuestions()}
function canGo(i){return i===0||!!S.name}
function go(i){if(!canGo(i))return;S.step=i;S.maxStep=Math.max(S.maxStep||0,i);save();render();window.scrollTo(0,0)}
function updateNav(){
  var st=$('#steps');st.innerHTML='';
  PAGES.forEach(function(pg,i){var b=el('button',{type:'button',title:pg.title,'aria-label':pg.title});
    if(i===S.step)b.className='cur';else if(i<=(S.maxStep||0))b.className='done';
    b.disabled=!canGo(i);b.onclick=function(){go(i)};st.appendChild(b)});
  var nav=$('#nav');nav.hidden=!S.name;
  $('#back').disabled=S.step<=0;
  var nx=$('#next');nx.hidden=S.step>=PAGES.length-1;
  nx.textContent=S.step===PAGES.length-2?'До здачі →':(S.step===6?'До завдань →':'Далі →');
  var pts=S.name&&D?(' · бали: '+fmt(S.finished?S.points:totalPoints(),1)+' з 12'):'';
  $('#navmid').textContent=PAGES[S.step].title+pts;
  $('#who').textContent=S.name?(S.name+' · '+S.cls):'';
}
function render(){var m=$('#main');m.innerHTML='';if(S.name&&!D)initData();if(!S.name)S.step=0;R[PAGES[S.step].id](m);updateNav()}
$('#back').onclick=function(){go(S.step-1)};
$('#next').onclick=function(){go(S.step+1)};
render();
</script>
